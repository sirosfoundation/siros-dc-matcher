[workspace]
resolver = "2"
members = [
    "crates/android-credman-sys",
    "crates/android-credman",
    "crates/siros-dcql",
    "crates/siros-dc-matcher-core",
    "crates/siros-dc-matcher-wasm",
    "crates/siros-dc-matcher-ffi",
    "crates/siros-dc-matcher-testhost",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/sirosfoundation/siros-dc-matcher"
authors = ["SIROS Foundation"]
# Held by everything that ships inside the credential picker — siros-dcql,
# -core, -wasm and the two android-credman crates — and checked on 1.82 in
# CI. The -ffi and -testhost crates override this upward: uniffi's bindgen
# chain and wasmtime both need more.
rust-version = "1.82"

[workspace.dependencies]
siros-dcql = { version = "0.11.0", path = "crates/siros-dcql" }
siros-dc-matcher-core = { path = "crates/siros-dc-matcher-core" }
android-credman = { path = "crates/android-credman", version = "0.1.0" }

# Strings that are UTF-8 and NUL-terminated at once: the string type of the
# android-credman boundary.
c8str = { version = "0.2.1", features = ["alloc"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
# Hash sets and maps for every crate that links into matcher.wasm. std's
# default hasher seeds itself from WASI `random_get`, which the Credential
# Manager host does not provide; FxHash needs no seed.
rustc-hash = "2.1.3"
# Every error type derives `Display` and `Error` with it.
thiserror = "2"

# Host and mobile builds. Unwinding, deliberately: UniFFI turns panics into
# errors with `catch_unwind`, which cannot work without it — an aborting build
# silently removes the error handling the generated bindings appear to provide,
# and makes the blast radius of any bug the whole application rather than one
# failed call. That matters most for a library fed DCQL written by a verifier,
# which is untrusted input arriving over the network.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# The matcher, and only the matcher. It runs inside the credential picker,
# where a trap is indistinguishable from "no matching credential" and there is
# no error channel to unwind towards — so aborting costs nothing and saves the
# unwinding tables. A custom profile rather than a per-package one because
# Cargo does not allow `panic` in a package profile.
[profile.wasm-release]
inherits = "release"
panic = "abort"
strip = true
