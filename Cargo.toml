[workspace]
resolver = "2"
members = [
    "crates/siros-dcql",
    "crates/siros-dc-matcher-core",
    "crates/siros-dc-matcher-wasm",
    "crates/siros-dc-matcher-ffi",
    "crates/siros-dc-matcher-testhost",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/sirosfoundation/siros-dc-matcher"
authors = ["SIROS Foundation"]
rust-version = "1.82"

[workspace.dependencies]
siros-dcql = { version = "0.2.0", path = "crates/siros-dcql" }
siros-dc-matcher-core = { path = "crates/siros-dc-matcher-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# The matcher runs inside the credential picker, where a trap is
# indistinguishable from "no matching credential". Optimise for size, and
# abort rather than unwind.
#
# `strip = "debuginfo"`, NOT `strip = true`. This profile also builds the
# UniFFI cdylib, and UniFFI discovers a library's interface by reading
# metadata symbols out of it. Stripping symbols makes binding generation
# produce nothing at all — no error, no files, exit code 0 — which is a
# genuinely miserable thing to debug. Debug info is still dropped, so the
# matcher keeps almost all of the size win.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The matcher is the only artifact that ships inside someone else's process,
# and it is the only one nothing needs to read symbols from — so it, and only
# it, gets fully stripped.
[profile.release.package.siros-dc-matcher-wasm]
strip = true
