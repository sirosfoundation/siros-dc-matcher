[workspace]
resolver = "2"
members = [
    "crates/android-credman-sys",
    "crates/android-credman",
    "crates/siros-codec",
    "crates/siros-credential",
    "crates/siros-dcql",
    "crates/siros-display",
    "crates/siros-mdoc",
    "crates/siros-oid4vp",
    "crates/siros-presentation",
    "crates/siros-dc-matcher-core",
    "crates/siros-dc-matcher-wasm",
    "crates/siros-dc-matcher-ffi",
    "crates/siros-dc-matcher-testhost",
    "crates/siros-sdjwt",
    "crates/siros-transaction-data",
    "crates/siros-trust",
    "crates/siros-wallet-state",
    "crates/siros-zkp-req",
    "crates/siros-zkp-req-nym-auth",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/sirosfoundation/siros-dc-matcher"
authors = ["SIROS Foundation"]
# Held by everything that ships inside the credential picker — siros-dcql,
# siros-oid4vp without `crypto`, -core, -wasm, the two zkp_req crates and the
# two android-credman crates — and by siros-mdoc and siros-sdjwt, and checked
# on 1.82 in CI. The -ffi and -testhost crates override this upward: uniffi's
# bindgen chain and wasmtime both need more.
rust-version = "1.82"

[workspace.dependencies]
siros-codec = { path = "crates/siros-codec" }
siros-credential = { path = "crates/siros-credential" }
siros-dcql = { version = "0.12.0", path = "crates/siros-dcql" }
siros-display = { path = "crates/siros-display", default-features = false }
siros-mdoc = { path = "crates/siros-mdoc" }
siros-oid4vp = { path = "crates/siros-oid4vp" }
siros-sdjwt = { path = "crates/siros-sdjwt" }
siros-transaction-data = { path = "crates/siros-transaction-data" }
siros-trust = { path = "crates/siros-trust", default-features = false }
siros-wallet-state = { path = "crates/siros-wallet-state" }
siros-dc-matcher-core = { path = "crates/siros-dc-matcher-core" }
siros-zkp-req = { path = "crates/siros-zkp-req" }
siros-zkp-req-nym-auth = { path = "crates/siros-zkp-req-nym-auth", default-features = false }
android-credman = { path = "crates/android-credman", version = "0.1.0" }

# Strings that are UTF-8 and NUL-terminated at once: the string type of the
# android-credman boundary.
c8str = { version = "0.2.1", features = ["alloc"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
# Hash sets and maps for every crate that links into matcher.wasm. std's
# default hasher seeds itself from WASI `random_get`, which the Credential
# Manager host does not provide; FxHash needs no seed.
rustc-hash = "2.1.3"
# Iterator adapters. Only those without a hash map: std's hasher seeds itself from WASI
# `random_get`, which the picker's host lacks.
itertools = "0.12.1"

# Host and mobile builds. Unwinding, deliberately: UniFFI turns panics into
# errors with `catch_unwind`, which cannot work without it — an aborting build
# silently removes the error handling the generated bindings appear to provide,
# and makes the blast radius of any bug the whole application rather than one
# failed call. That matters most for a library fed DCQL written by a verifier,
# which is untrusted input arriving over the network.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# The matcher, and only the matcher. It runs inside the credential picker,
# where a trap is indistinguishable from "no matching credential" and there is
# no error channel to unwind towards — so aborting costs nothing and saves the
# unwinding tables. A custom profile rather than a per-package one because
# Cargo does not allow `panic` in a package profile.
[profile.wasm-release]
inherits = "release"
panic = "abort"
strip = true

# The zkp_req tests sign and verify ES256 and X.509 by the hundred. Without
# optimisation, these crates take most of the suite's time: the refusal table
# runs in 1.00 s as built by default and in 0.21 s with this, measured back to
# back on the same machine load.
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
