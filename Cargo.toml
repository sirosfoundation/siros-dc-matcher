[workspace]
resolver = "2"
members = [
    "crates/siros-dcql",
    "crates/siros-dc-matcher-core",
    "crates/siros-dc-matcher-wasm",
    "crates/siros-dc-matcher-ffi",
    "crates/siros-dc-matcher-testhost",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/sirosfoundation/siros-dc-matcher"
authors = ["SIROS Foundation"]
rust-version = "1.82"

[workspace.dependencies]
siros-dcql = { version = "0.1.0", path = "crates/siros-dcql" }
siros-dc-matcher-core = { path = "crates/siros-dc-matcher-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# The matcher runs inside the credential picker, where a trap is
# indistinguishable from "no matching credential". Optimise the WASM profile
# for size and abort rather than unwind — see docs/non-functional.md.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
