# Exact toolchain pin. This file is the single source of truth: rustup uses it
# for every local `cargo`/`rustc`, and CI installs from it through
# .github/actions/rust-toolchain, so a local build and a CI build run the very
# same compiler.
#
# Why exact: `channel = "stable"` floats, so every Rust release silently
# changes the compiler (new default lints turn `-D warnings` red without a
# commit; codegen changes alter the bytes of matcher.wasm). The published
# matcher.wasm is something we ask other people to run inside their credential
# picker, and "built from this commit" has to be checkable: the same commit
# must build the same bytes, which needs the same rustc.
#
# This is not the MSRV. `rust-version` in Cargo.toml is the oldest compiler the
# library crates promise to support and is checked by the `msrv` CI job.
#
# To bump: change `channel` to the new release (Dependabot's `rust-toolchain`
# ecosystem opens this PR monthly), run fmt, clippy and tests, rebuild
# `make matcher`, and expect the matcher.wasm digest to change. Say so in the PR.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["wasm32-wasip1"]
