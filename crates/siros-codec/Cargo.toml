[package]
name = "siros-codec"
version = "0.11.0"
description = "Strict CBOR, strict JSON, base64 and dates for the SIROS wallet core"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rustc-hash = { workspace = true }
serde = { workspace = true }
# `raw_value` gives each JSON value as its text, which keeps numbers as their writer wrote them.
serde_json = { workspace = true, features = ["raw_value"] }
