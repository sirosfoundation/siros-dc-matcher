[package]
name = "siros-dc-matcher-wasm"
version = "0.1.0"
description = "The SIROS DC API matcher, built for the Android Credential Manager WASM sandbox"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "matcher"
path = "src/main.rs"

[dependencies]
# Host level 2 and no higher: the matcher emits entry sets, and enabling a
# level adds its imports to the ones every host must resolve.
android-credman = { workspace = true, features = ["v2"] }
siros-dc-matcher-core = { workspace = true }
siros-dcql = { workspace = true }
serde_json = { workspace = true }
