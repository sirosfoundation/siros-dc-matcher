[package]
name = "siros-dc-matcher-wasm"
version = "0.1.0"
description = "The SIROS DC API matcher, built for the Android Credential Manager WASM sandbox"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "matcher"
path = "src/main.rs"

[dependencies]
android-credman = { workspace = true }
siros-dc-matcher-core = { workspace = true }
siros-dcql = { workspace = true }
siros-display = { workspace = true }
siros-oid4vp = { workspace = true }
serde_json = { workspace = true }

# The unit tests build wallets from core's fixtures.
[dev-dependencies]
siros-dc-matcher-core = { workspace = true, features = ["test-fixtures"] }
