[package]
name = "siros-picker-testhost"
version = "0.1.0"
description = "A Credential Manager host implementation, so the picker is testable off-device"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# wasmtime 30 and its icu dependencies want 1.88. This crate is a test
# harness that never ships, so its floor is allowed above the workspace's.
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
serde_json = { workspace = true }
wasmtime = "30.0.2"
wasmtime-wasi = "30.0.2"

# The differential test runs the wallet's plan beside the picker: the presentation component's
# test wallet and verifier, and the registration writer.
[dev-dependencies]
android-credman = { workspace = true }
siros-codec = { workspace = true }
siros-credential = { workspace = true }
siros-display = { workspace = true, features = ["credential"] }
siros-oid4vp = { workspace = true, features = ["crypto"] }
siros-presentation = { workspace = true, features = ["test-fixtures"] }
siros-registration = { workspace = true, features = ["wallet"] }
siros-transaction-data = { workspace = true, features = ["wallet"] }
siros-trust = { workspace = true, features = ["chain"] }
siros-wallet-state = { workspace = true }
siros-zkp-req-nym-auth = { workspace = true, features = ["test-fixtures"] }
