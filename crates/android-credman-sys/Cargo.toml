[package]
name = "android-credman-sys"
version = "0.1.0"
description = "Raw imports of the Android Credential Manager matcher host ABI"
license = "MIT OR Apache-2.0"
# Edition 2021: this crate ships inside siros-dc-matcher's matcher.wasm,
# whose crates hold Rust 1.82 (checked by the `msrv` CI job), and edition 2024
# needs 1.85.
edition = "2021"
rust-version = "1.82"
readme = "README.md"

[dependencies]

# One feature per host level: `vN` declares the functions of level N.
# Level 3 is `AddPaymentEntryToSetV2`, imported from `credman_v2`.
[features]
v2 = []
v3 = []
v4 = []
v5 = []
v6 = []
v7 = []
