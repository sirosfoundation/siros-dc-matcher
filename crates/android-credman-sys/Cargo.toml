[package]
name = "android-credman-sys"
version = "0.1.0"
description = "Raw imports of the Android Credential Manager matcher host ABI"
license = "MIT OR Apache-2.0"
# Edition 2024 needs Rust 1.85; matcher.wasm's crates hold 1.82.
edition = "2021"
rust-version = "1.82"
readme = "README.md"

[dependencies]

# One feature per host level: `vN` declares the functions of level N.
# Level 3 is `AddPaymentEntryToSetV2`, imported from `credman_v2`.
[features]
v2 = []
v3 = []
v4 = []
v5 = []
v6 = []
v7 = []
