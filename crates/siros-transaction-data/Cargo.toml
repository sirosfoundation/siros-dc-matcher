[package]
name = "siros-transaction-data"
version = "0.11.0"
description = "OpenID4VP transaction data for the SIROS wallet core on the PaSO model: type definitions and their sources, payload conformance, images, generic rendering, selection and the KB-JWT binding"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa", "alloc"] }
# SVG documents, read for their size and the URLs they reference.
roxmltree = "0.20.0"
rustc-hash = { workspace = true }
serde = { workspace = true }
# `raw_value` gives each JSON value as its text, which keeps numbers as the verifier wrote them.
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10.9"
siros-codec = { workspace = true, features = ["json"] }
siros-credential = { workspace = true, features = ["chain"] }
siros-dcql = { workspace = true }
siros-display = { workspace = true, features = ["credential"] }
siros-oid4vp = { workspace = true, features = ["crypto"] }
siros-trust = { workspace = true, features = ["chain"] }
siros-wallet-state = { workspace = true }
# Label lengths in extended grapheme clusters (UAX #29). 1.13 needs Rust 1.85.
unicode-segmentation = "~1.12.0"

[dev-dependencies]
# The TS12 schemas as the oracle of the payload parsers. Only the validator: no remote
# references, no TLS.
jsonschema = { version = "0.42.0", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "alloc", "pem"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "builder"] }
