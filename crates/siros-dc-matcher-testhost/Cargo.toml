[package]
name = "siros-dc-matcher-testhost"
version = "0.1.0"
description = "A Credential Manager host implementation, so the matcher is testable off-device"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# wasmtime 30 and its icu dependencies want 1.88. This crate is a test
# harness that never ships, so its floor is allowed above the workspace's.
rust-version = "1.88"

# wasmtime is added in Phase 1 alongside the first real emission path.
[dependencies]
anyhow = "1.0.104"
serde_json = { workspace = true }
wasmtime = "30.0.2"
wasmtime-wasi = "30.0.2"

[dev-dependencies]
siros-dc-matcher-core = { path = "../siros-dc-matcher-core", features = ["test-fixtures"] }
