# Generate Android-aware Kotlin bindings.
#
# Without this, UniFFI emits a cleaner that calls java.lang.ref.Cleaner —
# API 33 — guarded only by a `Class.forName` in a try/catch. That is safe at
# runtime, and invisible to Android lint, which reports a NewApi error against
# a minSdk-28 module and fails the build. `android_cleaner` emits
# android.system.SystemCleaner behind an SDK_INT check lint can actually read.
[bindings.kotlin]
android = true
android_cleaner = true
