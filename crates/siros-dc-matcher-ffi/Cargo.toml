[package]
name = "siros-dc-matcher-ffi"
version = "0.6.0"
description = "Kotlin/Swift bindings for the SIROS DC API matcher"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "siros_dc_matcher_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
siros-dc-matcher-core = { workspace = true }
siros-dcql = { workspace = true }
serde_json = { workspace = true }
uniffi = { version = "0.28", features = ["build"] }
thiserror = "2"

[dev-dependencies]
siros-dc-matcher-core = { workspace = true, features = ["test-fixtures"] }
