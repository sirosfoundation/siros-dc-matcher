[package]
name = "siros-dc-matcher-ffi"
version = "0.6.2"
description = "Kotlin/Swift bindings for the SIROS DC API matcher"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# uniffi 0.28's bindgen chain reaches textwrap -> smawk 0.3.3, whose
# manifest is edition 2024, so Cargo itself refuses to parse it before
# 1.85; the rest of that tree then wants 1.88. Nothing here ships in the
# picker, so the floor is higher than the workspace's on purpose.
rust-version = "1.88"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "siros_dc_matcher_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
siros-dc-matcher-core = { workspace = true }
siros-dcql = { workspace = true }
serde_json = { workspace = true }
uniffi = { version = "0.28", features = ["build"] }
thiserror = "2"

[dev-dependencies]
siros-dc-matcher-core = { workspace = true, features = ["test-fixtures"] }
