[package]
name = "siros-dc-matcher-ffi"
version = "0.11.0"
description = "Kotlin/Swift bindings for the SIROS DC API matcher and the zkp_req session, vp_token and verifier"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# uniffi 0.28's bindgen chain reaches textwrap -> smawk 0.3.3, whose
# manifest is edition 2024, so Cargo itself refuses to parse it before
# 1.85; the rest of that tree then wants 1.88. Nothing here ships in the
# picker, so the floor is higher than the workspace's on purpose.
rust-version = "1.88"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "siros_dc_matcher_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
siros-dc-matcher-core = { workspace = true }
siros-dcql = { workspace = true }
siros-display = { workspace = true }
siros-oid4vp = { workspace = true }
siros-codec = { workspace = true }
siros-trust = { workspace = true, features = ["chain"] }
siros-zkp-req = { workspace = true }
siros-zkp-req-nym-auth = { workspace = true, features = ["credential"] }
serde_json = { workspace = true }
uniffi = { version = "0.28", features = ["build"] }
thiserror = { workspace = true }

[dev-dependencies]
siros-dc-matcher-core = { workspace = true, features = ["test-fixtures"] }
siros-zkp-req-nym-auth = { workspace = true, features = ["test-fixtures"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }

[lints]
workspace = true
