[package]
name = "siros-dc-matcher-core"
version = "0.2.0"
description = "Credential database, match profile and picker emission for the SIROS DC API matcher"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# A canonical test wallet, shared by the suites that would otherwise each
# write their own and drift.
test-fixtures = []

[dependencies]
siros-dcql = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
serde_bytes = "0.11.19"

[dev-dependencies]
# This crate, on itself, to switch on `test-fixtures` for its own integration
# tests. Without it they compile only when some *other* workspace crate happens
# to enable the feature and Cargo unifies it — so `cargo test -p
# siros-dc-matcher-core` alone would fail while `--workspace` passed.
siros-dc-matcher-core = { path = ".", features = ["test-fixtures"] }
serde_json.workspace = true
