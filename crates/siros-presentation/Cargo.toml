[package]
name = "siros-presentation"
version = "0.11.0"
description = "Presentation for the SIROS wallet core: the plan of a request over the wallet's credentials, the consent view, and the response to the user's selection"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Without `wallet`: the matching for the credential picker, checked on 1.82 in CI. `wallet`
# builds with the toolchain of rust-toolchain.toml.
rust-version.workspace = true

[features]
default = ["wallet"]
# Phase 1's plan and consent view over a verified request, and phase 2. Without it the crate
# holds the matching, its transaction data selection and the display rule (A9): no crypto, no
# prover and no display resolution.
wallet = [
    "dep:rand_core",
    "dep:sha2",
    "dep:siros-mdoc",
    "dep:siros-sdjwt",
    "dep:zeroize",
    "siros-codec/json",
    "siros-credential/chain",
    "siros-display/credential",
    "siros-mdoc/crypto",
    "siros-oid4vp/crypto",
    "siros-transaction-data/wallet",
    "siros-trust/chain",
    "siros-zkp-req-nym-auth/request",
]
# The wallet, its host and the verifier of the tests: credentials issued, requests signed and
# taken through intake, responses decrypted with code of their own.
test-fixtures = [
    "wallet",
    "dep:aes-gcm",
    "dep:ciborium",
    "dep:p256",
    "dep:x509-cert",
    "sha2/oid",
    "siros-zkp-req-nym-auth/test-fixtures",
]

[dependencies]
itertools = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
siros-codec = { workspace = true }
siros-credential = { workspace = true }
siros-dcql = { workspace = true }
siros-oid4vp = { workspace = true }
siros-transaction-data = { workspace = true }
siros-trust = { workspace = true }
siros-wallet-state = { workspace = true }
siros-zkp-req = { workspace = true }
siros-zkp-req-nym-auth = { workspace = true }
rand_core = { version = "0.6.4", optional = true }
sha2 = { version = "0.10.9", optional = true }
siros-display = { workspace = true }
siros-mdoc = { workspace = true, optional = true }
siros-sdjwt = { workspace = true, optional = true }
thiserror = { workspace = true }
zeroize = { version = "1.8.1", optional = true }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"], optional = true }
ciborium = { workspace = true, optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "ecdh", "alloc", "pem"], optional = true }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "builder"], optional = true }

# The tests act as the verifier: they sign requests, issue credentials, and decrypt and check
# responses with code of their own. This crate, on itself, switches on `test-fixtures` for them.
[dev-dependencies]
siros-presentation = { path = ".", features = ["test-fixtures"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
ciborium = { workspace = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "ecdh", "alloc", "pem"] }
rand_core = "0.6.4"
serde_json = { workspace = true }
sha2 = { version = "0.10.9", features = ["oid"] }
siros-codec = { workspace = true }
siros-credential = { workspace = true }
siros-display = { workspace = true, features = ["credential"] }
siros-oid4vp = { workspace = true, features = ["crypto"] }
siros-wallet-state = { workspace = true }
siros-zkp-req-nym-auth = { workspace = true, features = ["test-fixtures", "request"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "builder"] }

[lints]
workspace = true
