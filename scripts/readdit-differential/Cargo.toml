# Records what readdit (AltmannPeter/readdit-demo, commit 1cf3f26: nym-longfellow and nym-vega,
# the reference code of the system rulebooks' Section 10) computes for a credential of the test issuer, a redirect session
# and a v0.4 presentation. Its output is crates/siros-zkp-req-nym-auth/tests/vectors/readdit.json,
# which tests/readdit.rs compares with this workspace's values. Run it from the repository root:
#
#     cargo run --manifest-path scripts/readdit-differential/Cargo.toml \
#       > crates/siros-zkp-req-nym-auth/tests/vectors/readdit.json
#
# Cargo fetches readdit from its pinned commit (CONTRIBUTING.md, "Provenance"). The repository
# holds readdit's computed values only.
[package]
name = "readdit-differential"
version = "0.0.0"
edition = "2021"
publish = false
license = "BSD-2-Clause"

[workspace]

[dependencies]
nym-longfellow = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "1cf3f2610318e896b0a1cde4b30d6b15d94ccfd0" }
nym-vega = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "1cf3f2610318e896b0a1cde4b30d6b15d94ccfd0" }
vega-age = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "1cf3f2610318e896b0a1cde4b30d6b15d94ccfd0" }
siros-zkp-req-nym-auth = { path = "../../crates/siros-zkp-req-nym-auth", features = ["test-fixtures"] }
siros-zkp-req = { path = "../../crates/siros-zkp-req" }
serde_json = "1"
hex = "0.4"
