name: Release — matcher.wasm + crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Build matcher.wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build -p siros-dc-matcher-wasm --target wasm32-wasip1 --release

      # This binary runs inside other people's credential picker. "Built from
      # this commit" has to be something they can check, so the digest is
      # recorded in the release rather than left implicit.
      - name: Record digest
        run: |
          cp target/wasm32-wasip1/release/matcher.wasm .
          sha256sum matcher.wasm | tee matcher.wasm.sha256
          echo "toolchain: $(rustc --version)" | tee -a matcher.wasm.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matcher-wasm
          path: |
            matcher.wasm
            matcher.wasm.sha256

  crate:
    name: Publish siros-dcql to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Publishing is idempotent-hostile: a version can never be replaced or
      # reused. Fail loudly here rather than half-publishing a release.
      - run: cargo publish -p siros-dcql --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [wasm, crate]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: matcher-wasm
          path: artifacts/
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/matcher.wasm
            artifacts/matcher.wasm.sha256
