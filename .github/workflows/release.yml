name: Release — matcher.wasm + crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Build matcher.wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --locked -p siros-dc-matcher-wasm --target wasm32-wasip1 --release

      # This binary runs inside other people's credential picker. "Built from
      # this commit" has to be something they can check, so the digest is
      # recorded in the release rather than left implicit.
      - name: Record digest
        run: |
          cp target/wasm32-wasip1/release/matcher.wasm .
          sha256sum matcher.wasm | tee matcher.wasm.sha256
          echo "toolchain: $(rustc --version)" | tee -a matcher.wasm.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matcher-wasm
          path: |
            matcher.wasm
            matcher.wasm.sha256

  crate:
    name: Publish siros-dcql to crates.io
    runs-on: ubuntu-latest
    # Named in the crate's Trusted Publisher configuration on crates.io. The
    # environment is part of what is being trusted, so renaming it here without
    # updating that configuration breaks publishing.
    environment: crates-io
    permissions:
      contents: read
      # Lets the runner mint the OIDC token proving which workflow, in which
      # repository, is asking. That proof is the credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Trusted publishing: crates.io exchanges the workflow's OIDC identity
      # for a token that lives 30 minutes and is revoked when the job ends.
      # There is no long-lived registry secret in this repository to leak,
      # rotate, or forget to rotate.
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Repository tags track the matcher, which releases more often than the
      # DCQL crate does. Tagging a matcher release while siros-dcql is
      # unchanged would otherwise fail the whole release job on "crate version
      # already exists" — a broken pipeline reporting a real fact.
      - id: published
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="siros-dcql") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Decide on the status code, never on "did curl succeed". A rate
          # limit, an outage or a DNS failure is not evidence that the version
          # is unpublished, and treating it as such would both hide the outage
          # and start a publish on a guess.
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -A "siros-release (github-actions)" \
                   "https://crates.io/api/v1/crates/siros-dcql/$VERSION") || HTTP=000
          case "$HTTP" in
            200)
              echo "siros-dcql $VERSION is already published; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "siros-dcql $VERSION is new; publishing"
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io returned HTTP $HTTP for siros-dcql $VERSION."
              echo "::error::Cannot tell whether this version exists, so not guessing."
              exit 1 ;;
          esac

      # Publishing is idempotent-hostile: a version can never be replaced or
      # reused. Beyond the already-published case handled above, fail loudly
      # rather than half-publishing a release.
      - if: steps.published.outputs.skip == 'false'
        run: cargo publish --locked -p siros-dcql
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  android:
    name: Build and publish the AAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          api-level: 28
          ndk-version: "27.2.12479018"
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The AAR carries both the native encoder and matcher.wasm, so a wallet
      # gets the blob writer and the blob reader from one dependency at one
      # version. Shipping them apart is how a CBOR-writing encoder ends up
      # paired with a matcher that predates it, matching nothing and saying
      # nothing.
      - run: make aar pom

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          AAR=$(ls target/siros_dc_matcher_ffi-*.aar)
          POM=$(ls target/siros-dc-matcher-*.pom)
          mvn -B deploy:deploy-file \
            --settings /tmp/settings.xml \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DpomFile="$POM" -Dfile="$AAR" -Dpackaging=aar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aar
          path: |
            target/siros_dc_matcher_ffi-*.aar
            target/siros-dc-matcher-*.pom

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [wasm, crate, android]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: matcher-wasm
          path: artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aar
          path: artifacts/
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/matcher.wasm
            artifacts/matcher.wasm.sha256
            artifacts/siros_dc_matcher_ffi-*.aar
            artifacts/siros-dc-matcher-*.pom
