sonar.projectKey=sirosfoundation_siros-dc-matcher
sonar.organization=sirosfoundation

# Generated UniFFI bindings. They are committed because the Kotlin SDK vendors
# them as source, but they are not ours to write: every finding against them is
# a finding against UniFFI's code generator, actionable only upstream, and
# hand-editing them would be undone by the next `make bindings` — and caught by
# `make check-bindings` in the meantime.
sonar.exclusions=bindings/**

# jssecurity:S8707 — "a path canonicalized from CLI-controlled data must be
# validated before use" — in scripts/run_matcher.mjs.
#
# The rule is written for input that arrives from somewhere: a request
# parameter, an environment a service does not control. Here the CLI argument
# *is* the tool's interface. `run_matcher.mjs` is a developer harness that runs
# a request through the matcher on the developer's own machine; the path it
# opens is the one they typed, and there is no privilege boundary between them
# and the file.
#
# It is checked anyway — resolved, an existing regular file, `.json` — because
# that turns four kinds of mistake into a named error instead of a stack trace.
# What the rule wants beyond that is containment within a fixed root, and that
# would defeat the point: triaging a request captured off a device means
# opening it where it landed.
#
# Scoped to this one rule in this one file. Everything else in the script is
# analysed normally, and the three code smells the same scan found were fixed
# rather than silenced.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/run_matcher.mjs

# A developer harness has no unit tests and never will; it is exercised by
# being run. Excluded from the coverage requirement, not from analysis.
#
# The two `crates/` entries come from #20, which is on main but not on this
# branch's base (#19). Written out in full so that rebasing produces a visible
# conflict on this line rather than one value silently replacing the other —
# `sonar.coverage.exclusions` is last-one-wins, and losing the testhost
# exclusion would fail the gate for a reason nothing here would explain.
sonar.coverage.exclusions=crates/siros-dc-matcher-testhost/**,crates/siros-dc-matcher-ffi/uniffi-bindgen.rs,scripts/**
