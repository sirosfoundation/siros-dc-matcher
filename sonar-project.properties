sonar.projectKey=sirosfoundation_siros-dc-matcher
sonar.organization=sirosfoundation

# Generated UniFFI bindings. They are committed because the Kotlin SDK vendors
# them as source, but they are not ours to write: every finding against them is
# a finding against UniFFI's code generator, actionable only upstream, and
# hand-editing them would be undone by the next `make bindings` — and caught by
# `make check-bindings` in the meantime.
sonar.exclusions=bindings/**

# Coverage, produced by the `Coverage` step in .github/workflows/sonarcloud.yml.
sonar.rust.lcov.reportPaths=lcov.info

# Excluded from the coverage requirement, not from analysis:
#
# - the test host is the harness that runs the matcher, so covering it would
#   mean testing the tests;
# - `uniffi-bindgen.rs` is a build-time entry point that generates bindings and
#   never runs in a test.
sonar.coverage.exclusions=crates/siros-dc-matcher-testhost/**,crates/siros-dc-matcher-ffi/uniffi-bindgen.rs
