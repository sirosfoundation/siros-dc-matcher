<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 858" width="1440" height="858" role="img" aria-labelledby="title desc">
<title id="title">SIROS wallet core: layers, artifacts and host</title>
<desc id="desc">The crates of the workspace in five layers, the artifacts built from them, and the host each platform provides.</desc>
<style>
  .bg { fill: #ffffff; }
