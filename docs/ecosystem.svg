    .band-l3 { fill: #132339; }
    .band-l2 { fill: #12291b; }
    .band-l1 { fill: #2f2410; }
    .band-l0 { fill: #33151c; }
    .host { fill: #161b22; stroke: #6e7681; }
  }
</style>
